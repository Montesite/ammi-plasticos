  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #F79433;
      --primary-dark: #e07d1a;
      --blue: #2E4FAF;
      --dark: #1a1a2e;
      --border: #e5e7eb;
      --font: 'Plus Jakarta Sans', sans-serif;
      --header-h: 72px;
      --transition: all 0.3s ease;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font); overflow: hidden; height: 100vh; height: 100dvh; }
    a { text-decoration: none; color: inherit; }

    /* HEADER — idêntico ao index.html */
    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      height: var(--header-h);
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,0,0,0.07);
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }
    .header-inner {
      max-width: 1200px; margin: 0 auto; padding: 0 24px;
      height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 20px;
    }
    .logo-wrap { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .logo-wrap img { height: 54px; width: auto; object-fit: contain; }
    nav { display: flex; align-items: center; gap: 4px; }
    nav a {
      font-size: 0.88rem; font-weight: 500; color: var(--dark);
      padding: 8px 13px; border-radius: 8px; transition: var(--transition);
    }
    nav a:hover { color: var(--primary); background: rgba(247,148,51,0.08); }
    nav a.active { color: var(--primary); background: rgba(247,148,51,0.08); }
    .btn-wpp-header {
      display: flex; align-items: center; gap: 7px;
      background: #25D366; color: white; padding: 9px 17px;
      border-radius: 50px; font-weight: 600; font-size: 0.82rem;
      transition: var(--transition); white-space: nowrap; flex-shrink: 0;
    }
    .btn-wpp-header:hover { background: #1da851; color: white; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(37,211,102,0.3); }
    .btn-wpp-header svg { width: 15px; height: 15px; fill: white; flex-shrink: 0; }
    .social-icon-btn { display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: var(--transition); flex-shrink: 0; }
    .social-icon-btn:hover { transform: translateY(-2px); }
    .social-icon-btn svg { fill: white; }
    .social-icon-btn.ig { background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .social-icon-btn.fb { background: #1877f2; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .header-social { display: flex; align-items: center; gap: 8px; }
    .header-social .social-icon-btn { width: 34px; height: 34px; }
    .header-social .social-icon-btn svg { width: 16px; height: 16px; }
    .mobile-social { display: flex; justify-content: center; gap: 12px; margin-top: 6px; }
    .mobile-social .social-icon-btn { width: 40px; height: 40px; }
    .mobile-social .social-icon-btn svg { width: 19px; height: 19px; }
    .hamburger {
      display: none; flex-direction: column; gap: 5px; cursor: pointer;
      padding: 8px; border: none; background: transparent; border-radius: 8px;
    }
    .hamburger span { display: block; width: 24px; height: 2px; background: var(--dark); border-radius: 2px; transition: var(--transition); }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .mobile-nav {
      display: none; position: fixed; top: var(--header-h); left: 0; right: 0;
      background: white; border-bottom: 1px solid var(--border);
      box-shadow: 0 8px 20px rgba(0,0,0,0.1); z-index: 999;
      padding: 12px 16px; flex-direction: column; gap: 2px;
    }
    .mobile-nav.open { display: flex; }
    .mobile-nav a { display: block; padding: 11px 14px; border-radius: 10px; font-weight: 500; transition: var(--transition); }
    .mobile-nav a:hover { background: rgba(247,148,51,0.08); color: var(--primary); }
    .mobile-nav a.active { color: var(--primary); }
    .mobile-nav .m-wpp { margin-top: 6px; background: #25D366; color: white !important; text-align: center; font-weight: 600; border-radius: 50px !important; }
    .mobile-nav .m-wpp:hover { background: #1da851 !important; }

    /* IFRAME */
    #vitrine-frame {
      position: fixed;
      top: var(--header-h);
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: calc(100vh - var(--header-h));
      height: calc(100dvh - var(--header-h));
      border: none;
      display: block;
    }

    /* WHATSAPP FLOAT */
    .wpp-float {
      position: fixed; bottom: 26px; right: 26px; z-index: 1001;
      width: 54px; height: 54px; background: #25D366; color: white;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 18px rgba(37,211,102,0.38);
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    .wpp-float:hover { background: #1da851; box-shadow: 0 6px 24px rgba(37,211,102,0.5); color: white; }
    .wpp-float svg { width: 27px; height: 27px; fill: white; }

    /* RESPONSIVE */
    @media (max-width: 1100px) {
      nav, .header-actions { display: none; }
      .hamburger { display: flex; }
    }
    @media (max-width: 768px) {
      :root { --header-h: 64px; }
    }
  </style>

  <script>
    const hamburger = document.getElementById('hamburger');
    const mobileNav = document.getElementById('mobile-nav');

    hamburger.addEventListener('click', () => {
      const open = mobileNav.classList.toggle('open');
      hamburger.classList.toggle('open');
      hamburger.setAttribute('aria-expanded', open.toString());
    });

    function closeMob() {
      mobileNav.classList.remove('open');
      hamburger.classList.remove('open');
      hamburger.setAttribute('aria-expanded', 'false');
    }

    document.addEventListener('click', (e) => {
      if (!hamburger.contains(e.target) && !mobileNav.contains(e.target)) closeMob();
    });
  </script>
